<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Split Background</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .left, .right {
            width: 50%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .left {
            background-image: url("hassan.png");
        }

        .right {
            background-image: url("kaan.png");
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left"></div>
        <div class="right"></div>
    </div>
</body>
</html>
