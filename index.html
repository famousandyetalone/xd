<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kaan Special Burger</title>

    <!-- ICON -->
    <link rel="icon" type="image/png" href="kaan.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 30px 70px rgba(255, 165, 0, 0.4);
        }

        .burger-img {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            background-image: url("kaan.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffa500;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            color: #00ffcc;
        }

        ul {
            list-style: none;
            margin-bottom: 25px;
        }

        ul li {
            margin: 8px 0;
            opacity: 0.9;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #ffa500, #ff4500);
            color: black;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(255, 165, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="burger-img"></div>

        <h1>Kaan Special Burger</h1>
        <div class="subtitle">Der legendäre Signature-Burger 🍔</div>

        <ul>
            <li>🔥 Saftiges Premium Beef</li>
            <li>🧀 Extra geschmolzener Käse</li>
            <li>🥬 Frischer Salat & Tomaten</li>
            <li>🌶️ Geheimsoße à la Kaan</li>
        </ul>

        <div class="price">9,99 €</div>

        <button>Jetzt bestellen</button>
    </div>

</body>
</html>
