<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERCAN ALATAS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
        }

        /* Text oben */
        header {
            position: relative;
            height: 100vh; /* volle Höhe des Bildschirms */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        header h1 {
            font-size: 4em;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff; }
            100% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff; }
        }

        /* Bilder */
        .image-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 0; /* Abstand nach oben und unten */
            background-color: #111;
        }

        .image-section img {
            max-width: 90%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Für mobile Geräte */
        @media (max-width: 768px) {
            header h1 {
                font-size: 3em;
                letter-spacing: 3px;
            }

            .image-section {
                padding: 30px 0;
            }
        }

    </style>
</head>
<body>
    <!-- Header mit Text -->
    <header>
        <h1>ERCAN ALATAS</h1>
    </header>

    <!-- Erstes Bild -->
    <section class="image-section">
        <img src="kaan.png" alt="Kaan Bild">
    </section>

    <!-- Zweites Bild -->
    <section class="image-section">
        <img src="hassan.png" alt="Hassan Bild">
    </section>
</body>
</html>
